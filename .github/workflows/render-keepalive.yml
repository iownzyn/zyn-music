name: Render Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping ZYN MUSIC health endpoint
        run: |
          curl --fail --silent --show-error \
            --location \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            "https://zyn-music.onrender.com/health"
